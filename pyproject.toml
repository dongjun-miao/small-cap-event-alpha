[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-cap-event-alpha"
version = "0.2.0"
description = "Canonical CRSP event-study pipeline for a small-cap volume regime-shift signal"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
